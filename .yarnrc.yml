nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.14.0.cjs

npmRegistryServer: "https://registry.npmjs.org/"
npmMinimalAgeGate: 4320 # 3 days in minutes
npmPreapprovedPackages:
  - '@grafana/*'

enableScripts: false

# Additional hardening (checksums, immutability, git dep gate — Grafana supply-chain checklist).
# Do not add approvedGitRepositories entries beyond [] — broadening expands execution trust.
approvedGitRepositories: []
checksumBehavior: throw
defaultSemverRangePrefix: ""
enableHardenedMode: true
enableImmutableInstalls: true
nmHoistingLimits: workspaces
unsafeHttpWhitelist: []

# @grafana/aws-sdk bundles plugin-ui without re-declaring its peers on the workspace graph.
packageExtensions:
  '@grafana/aws-sdk@*':
    peerDependencies:
      '@grafana/data': '*'
      '@grafana/e2e-selectors': '*'
      '@grafana/runtime': '*'
      '@grafana/ui': '*'
      '@testing-library/jest-dom': '*'
      '@testing-library/react': '*'
      '@testing-library/user-event': '*'
      react: '*'
      react-dom: '*'
