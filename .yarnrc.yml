# Block all git / GitHub-shorthand dependencies at the resolver (empty allow-list).
# Do not set this to "**" or third-party hosts — that bypasses registry + release-age gates.
# https://yarnpkg.com/configuration/yarnrc#approvedGitRepositories
approvedGitRepositories: []

checksumBehavior: throw

defaultSemverRangePrefix: ""

enableHardenedMode: true

enableImmutableInstalls: true

enableScripts: false

nmHoistingLimits: workspaces

nodeLinker: node-modules

npmMinimalAgeGate: 4320

npmPreapprovedPackages:
  - "@grafana/*"

unsafeHttpWhitelist: []

yarnPath: .yarn/releases/yarn-4.14.0.cjs
